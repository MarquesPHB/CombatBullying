<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combatbullying | Acompanhamento</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    :root{--teal:#00685f;--ink:#102b3b;--muted:#617580;--mint:#dff6f0;--paper:#f7fbfb;--line:#d9e9e6;--red:#b42318}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Arial,sans-serif}.shell{max-width:980px;margin:auto;padding:28px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}h1{margin:5px 0;font-size:clamp(28px,5vw,44px)}h2{margin:0 0 8px}.muted{color:var(--muted);font-size:12px}.button{border:0;border-radius:10px;padding:11px 15px;background:var(--teal);color:white;font-weight:bold;cursor:pointer}.logout{background:none;color:var(--red);font-weight:bold;border:0;cursor:pointer}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}.protocol-card{padding:0;overflow:hidden}.protocol-open{width:100%;padding:18px;background:#fff;color:var(--ink);text-align:left;cursor:pointer}.protocol-open:hover{background:#f5fffc}.protocol-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.protocol-title h2{margin:0;font-size:18px}.status-badge{padding:6px 10px;border-radius:999px;background:var(--mint);color:var(--teal);font-size:11px;font-weight:bold}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0;font-size:12px}.meta b{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;margin-bottom:4px}.treatment-panel{padding:0 18px 18px;border-top:1px solid var(--line)}label{display:block;font-weight:bold;font-size:12px;margin:14px 0 7px}select,textarea,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}textarea{min-height:110px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.success,.error{padding:10px;border-radius:9px;margin-top:10px;font-size:12px}.success{background:#e9f8f1;color:#127050}.error{background:#fff0ef;color:var(--red)}.material-symbols-outlined{font-size:22px;vertical-align:middle}.bottom-nav{position:fixed;bottom:0;z-index:20;width:100%;height:72px;background:#fffffff2;backdrop-filter:blur(16px);border-top:1px solid #dce9fc;display:flex;justify-content:center}.nav-inner{width:100%;max-width:720px;display:flex;justify-content:space-around}.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:10px;font-weight:600;text-decoration:none}.nav-item .material-symbols-outlined{font-size:22px}.nav-item:hover,.nav-item.active{color:var(--teal);font-weight:800}@media(max-width:650px){.top{display:block}.meta{grid-template-columns:1fr 1fr}.top .logout{margin-top:12px}.protocol-title{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main class="shell">
  <section id="login"><div class="muted">ÁREA DO RESPONSÁVEL</div><h1>Carregando sua área...</h1><p class="muted">O acesso é feito pela tela única da equipe.</p><div id="login-message"></div></section>
  <section id="app" hidden><header class="top"><div><div class="muted">ÁREA DO RESPONSÁVEL</div><h1>Minhas demandas</h1><span class="muted">Acompanhe e registre as medidas tomadas.</span></div><div><a class="button" href="/admin"><span class="material-symbols-outlined">admin_panel_settings</span>Área administrativa</a><button class="logout" id="logout"><span class="material-symbols-outlined">logout</span>Sair</button></div></header><div id="message"></div><section id="list"></section></section>
</main>
<script>
const $=id=>document.getElementById(id);
async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',Accept:'application/json'},...options});const d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível concluir.');return d}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function load(){try{const [data,team]=await Promise.all([api('/api/my-protocols'),api('/api/team')]);const people=team.users.map(u=>`<option value="${u.id}">${esc(u.display_name)} (@${esc(u.username)})</option>`).join('');$('list').innerHTML=data.protocols.length?data.protocols.map(p=>`<article class="card protocol-card"><button class="protocol-open" data-open="${p.id}" aria-expanded="false"><div class="protocol-title"><h2>${esc(p.protocol_code)}</h2><span class="status-badge">${esc(p.status)}</span></div><div class="meta"><span><b>Tipo</b>${esc(p.aggression_type)}</span><span><b>Data e hora</b>${esc(p.occurred_date)} às ${esc(p.occurred_time)}</span><span><b>Atualizado</b>${new Date(p.updated_at).toLocaleString('pt-BR')}</span><span><b>Responsável</b>${esc(p.assigned_name||'Você')}</span></div><span class="muted"><span class="material-symbols-outlined">open_in_new</span> Clique para abrir a tratativa</span></button><div class="treatment-panel" id="treatment-${p.id}" hidden><p><b>Relato:</b> ${esc(p.report)}</p><label>Status<select id="status-${p.id}">${['Recebida','Em triagem','Encaminhada','Em tratativa','Concluída'].map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select></label><label>Encaminhar para outro responsável<select id="assignee-${p.id}"><option value="">Sem responsável</option>${people}</select></label><label>Medidas tomadas<textarea id="notes-${p.id}" placeholder="Descreva as providências, contatos e encaminhamentos realizados...">${esc(p.treatment_notes)}</textarea></label><div class="actions"><button class="button" data-save="${p.id}">Salvar fluxo de tratamento</button></div><div id="saved-${p.id}"></div>${p.treatment_steps?.length?`<div class="card"><b>Histórico do tratamento</b>${p.treatment_steps.map(s=>`<p class="muted"><b>${esc(s.status)}</b> · ${esc(s.actor_name||'Equipe')} · ${new Date(s.created_at).toLocaleString('pt-BR')}<br>${esc(s.notes||'Sem observações.')}${s.assigned_name?' · Encaminhado para '+esc(s.assigned_name):''}</p>`).join('')}</div>`:''}</div></article>`).join(''):'<div class="card"><h2>Nenhuma demanda encaminhada</h2><p class="muted">Quando uma demanda for encaminhada pelo administrador, ela aparecerá nesta página.</p></div>';data.protocols.forEach(p=>{const select=$('assignee-'+p.id);if(select&&p.assigned_to)select.value=p.assigned_to});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const panel=$('treatment-'+b.dataset.open);const open=panel.hidden;panel.hidden=!open;b.setAttribute('aria-expanded',String(open))});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save;try{await api('/api/protocols/'+id,{method:'PATCH',body:JSON.stringify({status:$('status-'+id).value,assigned_to:$('assignee-'+id).value||null,treatment_notes:$('notes-'+id).value})});$('saved-'+id).innerHTML='<div class="success">Fluxo salvo. A demanda foi atualizada.</div>';setTimeout(load,500)}catch(e){$('saved-'+id).innerHTML='<div class="error">'+esc(e.message)+'</div>'}})}catch(e){$('message').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function start(){const me=await api('/api/me');if(!me.user){location.href='/admin';return}if(me.user.role==='admin'){location.href='/admin';return}$('login').hidden=true;$('app').hidden=false;load()}
function initialize(){const loginForm=$('login-form');const recoveryButton=$('recover');const logoutButton=$('logout');if(loginForm)loginForm.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});await start()}catch(error){const message=$('login-message');if(message)message.innerHTML='<div class="error">'+esc(error.message)+'</div>'}});if(recoveryButton)recoveryButton.addEventListener('click',()=>{$('recovery').hidden=!$('recovery').hidden});if(logoutButton)logoutButton.addEventListener('click',()=>api('/api/logout',{method:'POST'}).finally(()=>location.reload()));start().catch(error=>{const message=$('login-message');if(message)message.innerHTML='<div class="error">'+esc(error.message)+'</div>'})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initialize);else initialize();
</script>
<nav class="bottom-nav" aria-label="Navegação principal"><div class="nav-inner"><a class="nav-item" href="/"><span class="material-symbols-outlined">shield_with_heart</span>Início</a><a class="nav-item" href="/?screen=report"><span class="material-symbols-outlined">edit_document</span>Relatar</a><a class="nav-item" href="/?screen=protocol"><span class="material-symbols-outlined">verified</span>Protocolos</a><a class="nav-item" href="/?screen=guide"><span class="material-symbols-outlined">menu_book</span>Guia</a></div></nav>
<script src="/responsavel-attachments.js"></script>
</body></html>
